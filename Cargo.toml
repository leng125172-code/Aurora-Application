[workspace]
resolver = "3"
members = [
    "Libraries/AuroraCommunication/aurora-comm-core",
    "Libraries/AuroraCommunication/aurora-comm-transport",
    "Libraries/AuroraCommunication/aurora-comm-runtime",
    "Libraries/AuroraCommunication/aurora-modbus",
    "Services/AuroraCore",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
authors = ["Aurora Application Team"]
rust-version = "1.98"

[workspace.dependencies]
async-trait = "0.1.89"
anyhow = "1.0.100"
bytes = "1.10.1"
futures = "0.3.31"
prost = "0.14.1"
redb = "3.0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tokio-postgres = "0.7.15"
tokio-util = { version = "0.7.16", features = ["rt"] }
tonic = "0.14.2"
tonic-prost = "0.14.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
