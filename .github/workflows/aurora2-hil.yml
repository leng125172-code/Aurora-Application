name: Aurora 2.0 HIL Gate

on:
  workflow_dispatch:
    inputs:
      soak_hours:
        description: Continuous hardware soak duration
        required: true
        default: "72"

jobs:
  communication-hil:
    runs-on: [self-hosted, aurora-hil]
    timeout-minutes: 4380
    env:
      AURORA_OPCUA_ENDPOINT: ${{ secrets.AURORA_OPCUA_ENDPOINT }}
      AURORA_OPCUA_PARENT_NODE: ${{ secrets.AURORA_OPCUA_PARENT_NODE }}
      AURORA_OPCUA_SCALAR_NODE: ${{ secrets.AURORA_OPCUA_SCALAR_NODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Run protocol HIL and mixed-device latency soak
        shell: bash
        run: Tools/run-aurora2-hil.sh "${{ inputs.soak_hours }}"
